<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Aspire Travels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">Aspire Travels</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="packages.html">Trips</a>
        <a href="reserve.html">Reserve</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="site-wrap">
    <section class="wrap form-container">
      <h1>Get in touch</h1>
      <p>Questions, group bookings, or custom itineraries — drop us a line.</p>

      <form>
        <label for="fullname">Full name</label>
        <input id="fullname" type="text" placeholder="Jane Doe">

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Tell us about your travel plans..."></textarea>

        <div class="form-actions">
          <button class="btn primary">Send message</button>
        </div>
      </form>

      <div class="contact-details">
        <p><strong>Email:</strong> <a href="mailto:aspire_travels@gmail.com">aspire_travels@gmail.com</a></p>
        <p><strong>Phone:</strong> +1 (800) 123-4567</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>&copy; Aspire Travels</p>
    </div>
  </footer>
</body>
</html>
