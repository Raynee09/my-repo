
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Assignment 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>JavaScript Lab Assignment 6</h1>
        <p>UI/UX Practical Assignment</p>
    </header>

    <main>
        <!-- Question 1: Arithmetic Operations -->
        <section class="card">
            <h2>1. Arithmetic Operations</h2>

            <input type="number" id="num1" placeholder="Enter first number">
            <input type="number" id="num2" placeholder="Enter second number">

            <button onclick="calculate()">Calculate</button>
            <div id="arithmeticResult" class="result"></div>
        </section>

        <!-- Question 2: Array Operations -->
        <section class="card">
            <h2>2. Array Operations</h2>

            <p>Array: [34, 12, 67, 5, 29]</p>
            <button onclick="arrayOperations()">Process Array</button>
            <div id="arrayResult" class="result"></div>
        </section>

        <!-- Question 3: Form Validation -->
        <section class="card">
            <h2>3. Student Form Validation</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Enter name">
                <input type="email" id="email" placeholder="Enter email">
                <input type="number" id="age" placeholder="Enter age">

                <button type="submit">Submit Form</button>
            </form>

            <div id="formResult" class="result"></div>
        </section>

        <!-- Question 4: Student Object -->
        <section class="card">
            <h2>4. Student Object</h2>

            <button onclick="studentOperations()">Display Student Details</button>
            <div id="studentResult" class="result"></div>
        </section>

        <!-- Question 5: Array Methods -->
        <section class="card">
            <h2>5. Array Methods</h2>

            <p>Array: [1, 2, 3, 4, 5, 6]</p>
            <button onclick="processNumbers()">Process Numbers</button>
            <div id="methodsResult" class="result"></div>
        </section>
    </main>

    <footer>
        <p>UI/UX Lab Assignment 6</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
